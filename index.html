<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortgage Repayment Calculator</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e1f22" />
  <style>
    :root {
      --bg: #121316;
      --card: #1e1f22;
      --surface: #282a2e;
      --border: #383a40;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --blue: #4285f4;
      --blue-hover: #5a95f5;
      --yellow: #fbbc04;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px 12px 32px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: var(--card);
      max-width: 480px;
      width: 100%;
      padding: 20px 18px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .main-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .main-value {
      font-size: 2.15rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.5px;
      margin: 0 0 18px;
    }

    .reset-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .reset-btn:hover {
      color: var(--text);
      border-color: var(--blue);
    }

    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .summary-item span {
      display: block;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .summary-item strong {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text);
    }

    .legend {
      display: flex;
      gap: 18px;
      font-size: 0.82rem;
      color: var(--text);
      margin-bottom: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      display: inline-block;
    }

    .dot.blue { background: var(--blue); }
    .dot.yellow { background: var(--yellow); }

    .chart-wrapper {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      user-select: none;
    }

    .y-axis {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 165px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      padding-bottom: 18px;
      min-width: 34px;
    }

    .chart-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .bars-container {
      height: 147px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
    }

    .bar-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border-radius: 2px 2px 0 0;
      overflow: hidden;
    }

    .bar-interest {
      background: var(--yellow);
      width: 100%;
      transition: height 0.2s ease;
    }

    .bar-principal {
      background: var(--blue);
      width: 100%;
      transition: height 0.2s ease;
    }

    .x-axis {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--muted);
      padding-top: 6px;
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .control-header label {
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 500;
    }

    .num-input-wrap {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }

    .num-input-wrap:focus-within {
      border-color: var(--blue);
    }

    .num-input-wrap input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      text-align: right;
      width: 90px;
      outline: none;
    }

    .num-input-wrap.small input {
      width: 44px;
    }

    .term-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .unit-tag {
      font-size: 0.78rem;
      color: var(--muted);
      margin-left: 4px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #3c4043;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--blue);
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      cursor: pointer;
    }

    .slider-val {
      min-width: 72px;
      text-align: right;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .freq-box {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .freq-card {
      background: var(--surface);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .freq-card span {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .freq-card strong {
      font-size: 0.96rem;
      color: var(--text);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-top">
    <div>
      <div class="main-label">Estimated Monthly Payment</div>
      <div class="main-value" id="monthlyOut">$0.00</div>
    </div>
    <button class="reset-btn" id="resetBtn" type="button">Reset</button>
  </div>

  <div class="summary-row">
    <div class="summary-item">
      <span>Total Interest</span>
      <strong id="totalInterestOut">$0</strong>
    </div>
    <div class="summary-item">
      <span>Total Payments</span>
      <strong id="totalPaymentsOut">$0</strong>
    </div>
    <div class="summary-item">
      <span>Payoff Time</span>
      <strong id="payoffTimeOut">0 yrs</strong>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot blue"></span> Principal Paid</div>
    <div class="legend-item"><span class="dot yellow"></span> Interest Paid</div>
  </div>

  <div class="chart-wrapper">
    <div class="y-axis" id="yAxis">
      <span>$0</span>
      <span>$0</span>
      <span>$0</span>
      <span>$0</span>
      <span>$0</span>
    </div>
    <div class="chart-area">
      <div class="bars-container" id="barsContainer"></div>
      <div class="x-axis" id="xAxis"></div>
    </div>
  </div>

  <!-- Loan Amount -->
  <div class="control-group">
    <div class="control-header">
      <label for="principalInput">Loan Amount</label>
      <div class="num-input-wrap">
        <input type="number" id="principalInput" value="288289" min="0" max="3000000" step="1000" />
      </div>
    </div>
    <div class="slider-row">
      <input type="range" id="principalSlider" value="288289" min="0" max="1500000" step="1000" />
      <span class="slider-val" id="principalBadge">$288k</span>
    </div>
  </div>

  <!-- Annual Interest Rate -->
  <div class="control-group">
    <div class="control-header">
      <label for="rateInput">Annual Interest Rate</label>
      <div class="num-input-wrap small">
        <input type="number" id="rateInput" value="6.59" min="0" max="20" step="0.01" />
        <span class="unit-tag">%</span>
      </div>
    </div>
    <div class="slider-row">
      <input type="range" id="rateSlider" value="6.59" min="0" max="15" step="0.05" />
      <span class="slider-val" id="rateBadge">6.59%</span>
    </div>
  </div>

  <!-- Loan Term (Years & Months) -->
  <div class="control-group">
    <div class="control-header">
      <label>Loan Term</label>
      <div class="term-inputs">
        <div class="num-input-wrap small">
          <input type="number" id="yearsInput" value="17" min="0" max="40" step="1" />
          <span class="unit-tag">yrs</span>
        </div>
        <div class="num-input-wrap small">
          <input type="number" id="monthsInput" value="7" min="0" max="11" step="1" />
          <span class="unit-tag">mths</span>
        </div>
      </div>
    </div>
    <div class="slider-row">
      <input type="range" id="termSlider" value="211" min="0" max="480" step="1" />
      <span class="slider-val" id="termBadge">17y 7m</span>
    </div>
  </div>

  <!-- Extra Monthly Payment -->
  <div class="control-group" style="margin-bottom: 0;">
    <div class="control-header">
      <label for="extraInput">Extra Monthly Payment</label>
      <div class="num-input-wrap small">
        <input type="number" id="extraInput" value="0" min="0" max="20000" step="50" />
      </div>
    </div>
    <div class="slider-row">
      <input type="range" id="extraSlider" value="0" min="0" max="5000" step="50" />
      <span class="slider-val" id="extraBadge">$0/mo</span>
    </div>
  </div>

  <!-- Australian Frequency & Current Interest Breakdown -->
  <div class="freq-box">
    <div class="freq-card">
      <span>Current Monthly Interest</span>
      <strong id="currInterestOut">$0.00</strong>
    </div>
    <div class="freq-card">
      <span>Current Monthly Principal</span>
      <strong id="currPrincipalOut">$0.00</strong>
    </div>
    <div class="freq-card">
      <span>Fortnightly (True / Half)</span>
      <strong id="fortnightlyOut">$0 / $0</strong>
    </div>
    <div class="freq-card">
      <span>Weekly (True / Quarter)</span>
      <strong id="weeklyOut">$0 / $0</strong>
    </div>
  </div>
</div>

<script>
  const audExact = new Intl.NumberFormat('en-AU', {
    style: 'currency',
    currency: 'AUD',
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  const audWhole = new Intl.NumberFormat('en-AU', {
    style: 'currency',
    currency: 'AUD',
    minimumFractionDigits: 0,
    maximumFractionDigits: 0
  });

  function formatCompactK(val) {
    if (val >= 1000000) {
      return '$' + (val / 1000000).toFixed(2).replace(/\.00$/, '') + 'M';
    }
    if (val >= 1000) {
      return '$' + Math.round(val / 1000) + 'k';
    }
    return '$' + Math.round(val);
  }

  function updateSliderFill(slider) {
    const min = parseFloat(slider.min) || 0;
    const max = parseFloat(slider.max) || 100;
    const val = Math.min(max, Math.max(min, parseFloat(slider.value) || 0));
    const pct = ((val - min) / (max - min)) * 100;
    slider.style.background = `linear-gradient(to right, #4285f4 0%, #4285f4 ${pct}%, #3c4043 ${pct}%, #3c4043 100%)`;
  }

  function pmt(rate, nper, pv) {
    if (nper <= 0 || pv <= 0) return 0;
    if (rate === 0) return pv / nper;
    const f = Math.pow(1 + rate, nper);
    return (pv * rate * f) / (f - 1);
  }

  function formatDuration(totalMonths) {
    if (totalMonths <= 0) return '0 yrs';
    const y = Math.floor(totalMonths / 12);
    const m = totalMonths % 12;
    if (m === 0) return `${y} year${y === 1 ? '' : 's'}`;
    if (y === 0) return `${m} mth${m === 1 ? '' : 's'}`;
    return `${y}y ${m}m`;
  }

  function calculate() {
    const principal = Math.max(0, parseFloat(document.getElementById('principalInput').value) || 0);
    const annualRate = Math.max(0, parseFloat(document.getElementById('rateInput').value) || 0);
    const years = Math.max(0, parseInt(document.getElementById('yearsInput').value, 10) || 0);
    const months = Math.min(11, Math.max(0, parseInt(document.getElementById('monthsInput').value, 10) || 0));
    const extra = Math.max(0, parseFloat(document.getElementById('extraInput').value) || 0);

    const totalMonths = (years * 12) + months;
    const totalYearsExact = totalMonths / 12;
    const r = (annualRate / 100) / 12;

    const baseMonthly = pmt(r, totalMonths, principal);
    const effectiveMonthly = principal > 0 && totalMonths > 0 ? baseMonthly + extra : 0;

    // Badges
    document.getElementById('principalBadge').textContent = formatCompactK(principal);
    document.getElementById('rateBadge').textContent = annualRate.toFixed(2).replace(/\.00$/, '.0') + '%';
    document.getElementById('termBadge').textContent = totalMonths > 0 ? `${years}y ${months}m` : '0 yrs';
    document.getElementById('extraBadge').textContent = `${audWhole.format(extra)}/mo`;

    // Current Month Split
    const firstInterest = principal * r;
    const firstPrincipal = Math.min(principal, Math.max(0, effectiveMonthly - firstInterest));
    document.getElementById('currInterestOut').textContent = audExact.format(firstInterest);
    document.getElementById('currPrincipalOut').textContent = audExact.format(firstPrincipal);

    // Fortnightly & Weekly (based on base scheduled repayment)
    const fnTrue = pmt((annualRate / 100) / 26, totalYearsExact * 26, principal);
    const fnHalf = baseMonthly / 2;
    const wkTrue = pmt((annualRate / 100) / 52, totalYearsExact * 52, principal);
    const wkQuarter = baseMonthly / 4;
    document.getElementById('fortnightlyOut').textContent = `${audWhole.format(fnTrue)} / ${audWhole.format(fnHalf)}`;
    document.getElementById('weeklyOut').textContent = `${audWhole.format(wkTrue)} / ${audWhole.format(wkQuarter)}`;

    // Amortisation simulation by year
    let balance = principal;
    let totalInterest = 0;
    let totalPayments = 0;
    let monthsElapsed = 0;
    const yearlyData = [];

    if (principal > 0 && totalMonths > 0 && effectiveMonthly > 0) {
      let yrPrincipal = 0;
      let yrInterest = 0;

      while (balance > 0.005 && monthsElapsed < 600) {
        monthsElapsed++;
        const interestForMonth = balance * r;
        let principalForMonth = effectiveMonthly - interestForMonth;

        if (principalForMonth <= 0 && r > 0) {
          // Payment doesn't cover interest; cap loop
          yrInterest += interestForMonth;
          totalInterest += interestForMonth;
          totalPayments += effectiveMonthly;
          if (monthsElapsed % 12 === 0 || monthsElapsed === totalMonths) {
            yearlyData.push({ year: Math.ceil(monthsElapsed / 12), principal: yrPrincipal, interest: yrInterest });
            yrPrincipal = 0;
            yrInterest = 0;
          }
          if (monthsElapsed >= totalMonths) break;
          continue;
        }

        if (principalForMonth > balance) {
          principalForMonth = balance;
        }

        const actualPayment = principalForMonth + interestForMonth;
        balance -= principalForMonth;
        totalInterest += interestForMonth;
        totalPayments += actualPayment;

        yrPrincipal += principalForMonth;
        yrInterest += interestForMonth;

        if (monthsElapsed % 12 === 0 || balance <= 0.005) {
          yearlyData.push({
            year: Math.ceil(monthsElapsed / 12),
            principal: yrPrincipal,
            interest: yrInterest
          });
          yrPrincipal = 0;
          yrInterest = 0;
        }
      }
    }

    document.getElementById('monthlyOut').textContent = audExact.format(effectiveMonthly);
    document.getElementById('totalInterestOut').textContent = audWhole.format(totalInterest);
    document.getElementById('totalPaymentsOut').textContent = audWhole.format(totalPayments);
    document.getElementById('payoffTimeOut').textContent = formatDuration(monthsElapsed);

    renderChart(yearlyData);
  }

  function renderChart(yearlyData) {
    const barsContainer = document.getElementById('barsContainer');
    const xAxis = document.getElementById('xAxis');
    const yAxis = document.getElementById('yAxis');

    barsContainer.innerHTML = '';
    xAxis.innerHTML = '';

    if (yearlyData.length === 0) {
      yAxis.innerHTML = '<span>$0</span><span>$0</span><span>$0</span><span>$0</span><span>$0</span>';
      return;
    }

    const maxAnnual = Math.max(...yearlyData.map(d => d.principal + d.interest), 1);

    // Build 5 Y-axis ticks
    const ticks = [1, 0.75, 0.5, 0.25, 0].map(mult => formatCompactK(maxAnnual * mult));
    yAxis.innerHTML = ticks.map(t => `<span>${t}</span>`).join('');

    // Render stacked vertical bars
    yearlyData.forEach(d => {
      const col = document.createElement('div');
      col.className = 'bar-col';
      col.title = `Yr ${d.year}: Principal ${audWhole.format(d.principal)}, Interest ${audWhole.format(d.interest)}`;

      const pPct = (d.principal / maxAnnual) * 100;
      const iPct = (d.interest / maxAnnual) * 100;

      const intDiv = document.createElement('div');
      intDiv.className = 'bar-interest';
      intDiv.style.height = `${iPct}%`;

      const priDiv = document.createElement('div');
      priDiv.className = 'bar-principal';
      priDiv.style.height = `${pPct}%`;

      col.appendChild(intDiv);
      col.appendChild(priDiv);
      barsContainer.appendChild(col);
    });

    // Render X-axis labels evenly (up to ~10 labels like Yr 1, Yr 4, Yr 7...)
    const totalYrs = yearlyData.length;
    const step = Math.max(1, Math.ceil(totalYrs / 10));
    for (let i = 0; i < totalYrs; i += step) {
      const lbl = document.createElement('span');
      lbl.textContent = `Yr ${yearlyData[i].year}`;
      xAxis.appendChild(lbl);
    }
  }

  // Sync Inputs & Sliders
  const principalInput = document.getElementById('principalInput');
  const principalSlider = document.getElementById('principalSlider');
  principalInput.addEventListener('input', () => {
    principalSlider.value = principalInput.value;
    updateSliderFill(principalSlider);
    calculate();
  });
  principalSlider.addEventListener('input', () => {
    principalInput.value = principalSlider.value;
    updateSliderFill(principalSlider);
    calculate();
  });

  const rateInput = document.getElementById('rateInput');
  const rateSlider = document.getElementById('rateSlider');
  rateInput.addEventListener('input', () => {
    rateSlider.value = rateInput.value;
    updateSliderFill(rateSlider);
    calculate();
  });
  rateSlider.addEventListener('input', () => {
    rateInput.value = rateSlider.value;
    updateSliderFill(rateSlider);
    calculate();
  });

  const yearsInput = document.getElementById('yearsInput');
  const monthsInput = document.getElementById('monthsInput');
  const termSlider = document.getElementById('termSlider');

  function syncTermFromInputs() {
    const y = Math.max(0, parseInt(yearsInput.value, 10) || 0);
    const m = Math.min(11, Math.max(0, parseInt(monthsInput.value, 10) || 0));
    termSlider.value = (y * 12) + m;
    updateSliderFill(termSlider);
    calculate();
  }
  yearsInput.addEventListener('input', syncTermFromInputs);
  monthsInput.addEventListener('input', syncTermFromInputs);
  termSlider.addEventListener('input', () => {
    const totalM = parseInt(termSlider.value, 10) || 0;
    yearsInput.value = Math.floor(totalM / 12);
    monthsInput.value = totalM % 12;
    updateSliderFill(termSlider);
    calculate();
  });

  const extraInput = document.getElementById('extraInput');
  const extraSlider = document.getElementById('extraSlider');
  extraInput.addEventListener('input', () => {
    extraSlider.value = extraInput.value;
    updateSliderFill(extraSlider);
    calculate();
  });
  extraSlider.addEventListener('input', () => {
    extraInput.value = extraSlider.value;
    updateSliderFill(extraSlider);
    calculate();
  });

  // Reset Button
  document.getElementById('resetBtn').addEventListener('click', () => {
    principalInput.value = 0;
    principalSlider.value = 0;
    rateInput.value = 0;
    rateSlider.value = 0;
    yearsInput.value = 0;
    monthsInput.value = 0;
    termSlider.value = 0;
    extraInput.value = 0;
    extraSlider.value = 0;
    document.querySelectorAll('input[type="range"]').forEach(updateSliderFill);
    calculate();
  });

  // Initialize
  document.querySelectorAll('input[type="range"]').forEach(updateSliderFill);
  calculate();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
